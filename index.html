<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141C24">
<title>Buscador de tags NFC</title>
<style>
  :root{
    --fondo:#141C24;
    --panel:#1D2833;
    --linea:#2C3A47;
    --texto:#EEF2F5;
    --tenue:#8FA0AF;
    --senal:#F2B441;
    --si:#00A870;
    --no:#374653;
    --alerta:#D9603C;
    --radio:14px;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    background:var(--fondo);
    color:var(--texto);
    font-family:"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
    font-size:16px;
    line-height:1.45;
    display:flex;
    flex-direction:column;
    overscroll-behavior:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .mono{font-family:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em}

  /* ---------- Encabezado ---------- */
  header{
    padding:14px 18px 12px;
    border-bottom:1px solid var(--linea);
    flex:none;
  }
  header h1{
    font-size:1.05rem;
    font-weight:600;
    letter-spacing:-.01em;
  }
  #objetivoChip{
    margin-top:6px;
    font-size:.9rem;
    color:var(--tenue);
  }
  #objetivoChip b{color:var(--senal);font-weight:600}

  /* ---------- Zona de estado (el protagonista) ---------- */
  #escenario{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px 18px;
    background:var(--fondo);
    transition:background-color .12s linear;
    min-height:0;
  }
  #escenario.reposo{background:var(--fondo)}
  #escenario.buscando{background:var(--fondo)}
  #escenario.acierto{background:var(--si)}
  #escenario.fallo{background:var(--no)}
  #escenario.problema{background:var(--alerta)}

  #veredicto{
    font-size:clamp(2.4rem,13vw,4rem);
    font-weight:700;
    letter-spacing:-.03em;
    line-height:1.05;
  }
  #detalle{
    margin-top:10px;
    font-size:1rem;
    color:var(--tenue);
    max-width:34ch;
  }
  .acierto #detalle,.fallo #detalle,.problema #detalle{color:rgba(255,255,255,.88)}

  #lectura{
    margin-top:22px;
    font-size:clamp(1.1rem,6vw,1.7rem);
    font-weight:600;
    word-break:break-all;
    max-width:100%;
  }
  #textoTag{
    margin-top:8px;
    font-size:.95rem;
    color:var(--tenue);
    max-width:34ch;
    word-break:break-word;
  }
  .acierto #textoTag,.fallo #textoTag{color:rgba(255,255,255,.85)}

  #contador{
    margin-top:26px;
    font-size:.88rem;
    color:var(--tenue);
  }
  .acierto #contador,.fallo #contador{color:rgba(255,255,255,.75)}

  /* Barra viva mientras escanea */
  #pulso{
    width:min(280px,70vw);
    height:3px;
    margin-top:20px;
    border-radius:2px;
    background:var(--linea);
    overflow:hidden;
    opacity:0;
  }
  #escenario.buscando #pulso{opacity:1}
  #pulso i{
    display:block;
    width:40%;
    height:100%;
    border-radius:2px;
    background:var(--senal);
    animation:barrido 1.1s ease-in-out infinite;
  }
  @keyframes barrido{
    0%{transform:translateX(-100%)}
    100%{transform:translateX(250%)}
  }

  /* ---------- Controles ---------- */
  .controles{
    flex:none;
    border-top:1px solid var(--linea);
    background:var(--panel);
    padding:14px 16px calc(16px + env(safe-area-inset-bottom));
  }

  .fila{display:flex;gap:10px;margin-bottom:10px}
  .fila:last-child{margin-bottom:0}

  button{
    font:inherit;
    color:var(--texto);
    background:transparent;
    border:1px solid var(--linea);
    border-radius:var(--radio);
    padding:13px 16px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  button:focus-visible{outline:2px solid var(--senal);outline-offset:2px}

  .principal{
    flex:1;
    background:var(--senal);
    border-color:var(--senal);
    color:#22190A;
    font-weight:650;
    font-size:1.05rem;
    padding:16px;
  }
  .principal.activo{
    background:transparent;
    color:var(--senal);
  }
  .secundaria{flex:1;font-size:.95rem}

  input[type=text]{
    flex:1;
    font:inherit;
    font-family:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
    letter-spacing:.04em;
    color:var(--texto);
    background:var(--fondo);
    border:1px solid var(--linea);
    border-radius:var(--radio);
    padding:13px 14px;
    min-width:0;
  }
  input[type=text]::placeholder{color:#5C6C7A;letter-spacing:normal;font-family:inherit}
  input[type=text]:focus{outline:none;border-color:var(--senal)}

  .modos{display:flex;gap:8px;margin-bottom:12px}
  .modo{
    flex:1;
    font-size:.82rem;
    padding:9px 6px;
    border-radius:10px;
    color:var(--tenue);
    line-height:1.25;
  }
  .modo[aria-pressed="true"]{
    color:var(--texto);
    border-color:var(--senal);
    background:rgba(242,180,65,.12);
  }

  .etiqueta{
    font-size:.82rem;
    color:var(--tenue);
    margin-bottom:7px;
  }

  /* ---------- Historial ---------- */
  details{border-top:1px solid var(--linea);margin-top:14px;padding-top:10px}
  summary{
    font-size:.88rem;
    color:var(--tenue);
    cursor:pointer;
    list-style:none;
    padding:4px 0;
  }
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";color:var(--senal)}
  details[open] summary::before{content:"▾ "}

  #historial{
    max-height:30vh;
    overflow-y:auto;
    margin-top:8px;
  }
  #historial li{
    list-style:none;
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--linea);
    font-size:.9rem;
  }
  #historial li:last-child{border-bottom:none}
  #historial .uid{flex:1;word-break:break-all}
  #historial .marca{flex:none;color:var(--tenue);font-size:.8rem}
  #historial li.esta .uid{color:var(--si);font-weight:600}
  #historial li.esta .marca{color:var(--si)}
  #vacio{color:var(--tenue);font-size:.88rem;padding:8px 0}

  /* ---------- Aviso de compatibilidad ---------- */
  #aviso{
    flex:none;
    background:var(--alerta);
    color:#fff;
    padding:14px 18px;
    font-size:.92rem;
    display:none;
  }
  #aviso.visible{display:block}
  #aviso code{
    font-family:"Roboto Mono",ui-monospace,monospace;
    background:rgba(0,0,0,.22);
    padding:1px 5px;
    border-radius:4px;
  }

  @media (prefers-reduced-motion:reduce){
    #pulso i{animation:none;width:100%}
    #escenario{transition:none}
  }
</style>
</head>
<body>

<div id="aviso" role="alert"></div>

<header>
  <h1>Buscador de tags NFC</h1>
  <p id="objetivoChip">Sin objetivo definido</p>
</header>

<main id="escenario" class="reposo" aria-live="polite">
  <p id="veredicto">Listo</p>
  <p id="detalle">Define qué tag buscas y empieza a escanear.</p>
  <p id="lectura" class="mono"></p>
  <p id="textoTag"></p>
  <div id="pulso"><i></i></div>
  <p id="contador"></p>
</main>

<section class="controles">
  <p class="etiqueta">Coincide cuando…</p>
  <div class="modos" role="group" aria-label="Criterio de coincidencia">
    <button class="modo" data-modo="uid" aria-pressed="true">El UID es igual</button>
    <button class="modo" data-modo="cola" aria-pressed="false">Terminan igual los últimos 3 bytes</button>
    <button class="modo" data-modo="texto" aria-pressed="false">El texto del tag lo contiene</button>
  </div>

  <p class="etiqueta" id="etiquetaObjetivo">Tag que buscas</p>
  <div class="fila">
    <input type="text" id="objetivo" placeholder="04:1A:2B:3C:4D:5E:6F"
           autocomplete="off" autocapitalize="characters" spellcheck="false"
           aria-labelledby="etiquetaObjetivo">
  </div>

  <div class="fila">
    <button class="secundaria" id="btnCapturar">Capturar de un tag</button>
    <button class="secundaria" id="btnLimpiar">Borrar historial</button>
  </div>

  <div class="fila">
    <button class="principal" id="btnEscanear">Iniciar escaneo</button>
  </div>

  <details>
    <summary>Tags leídas <span id="resumenLista"></span></summary>
    <ul id="historial"></ul>
    <p id="vacio">Todavía no has pasado ninguna tag.</p>
  </details>
</section>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const escenario = $("escenario"), veredicto = $("veredicto"), detalle = $("detalle"),
        lectura = $("lectura"), textoTag = $("textoTag"), contador = $("contador"),
        objetivo = $("objetivo"), objetivoChip = $("objetivoChip"),
        btnEscanear = $("btnEscanear"), btnCapturar = $("btnCapturar"),
        btnLimpiar = $("btnLimpiar"), historial = $("historial"),
        vacio = $("vacio"), resumenLista = $("resumenLista"), aviso = $("aviso");

  let modo = "uid";
  let escaneando = false;
  let capturando = false;
  let control = null;      // AbortController del escaneo
  let audio = null;        // AudioContext
  let wakeLock = null;
  let restaurar = null;    // temporizador para volver al estado "buscando"
  const vistas = new Map(); // uid normalizado -> {uid, texto, esta, hora}

  /* ---------- Utilidades ---------- */

  const normaliza = s => (s || "").toUpperCase().replace(/[^0-9A-F]/g, "");

  const bonito = s => {
    const n = normaliza(s);
    return n ? (n.match(/.{1,2}/g) || []).join(":") : "";
  };

  function pinta(clase, titulo, sub, uid, texto) {
    escenario.className = clase;
    veredicto.textContent = titulo;
    detalle.textContent = sub || "";
    lectura.textContent = uid ? bonito(uid) : "";
    textoTag.textContent = texto || "";
  }

  function vibra(patron) {
    try { navigator.vibrate && navigator.vibrate(patron); } catch (e) {}
  }

  function pita(frecuencia, duracion) {
    if (!audio) return;
    try {
      const osc = audio.createOscillator(), vol = audio.createGain();
      osc.type = "sine";
      osc.frequency.value = frecuencia;
      vol.gain.setValueAtTime(0.0001, audio.currentTime);
      vol.gain.exponentialRampToValueAtTime(0.25, audio.currentTime + 0.01);
      vol.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + duracion);
      osc.connect(vol).connect(audio.destination);
      osc.start();
      osc.stop(audio.currentTime + duracion + 0.02);
    } catch (e) {}
  }

  function despiertaAudio() {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
    } catch (e) { audio = null; }
  }

  async function mantenPantalla(encender) {
    try {
      if (encender && "wakeLock" in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      } else if (!encender && wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
    } catch (e) {}
  }

  /* ---------- Compatibilidad ---------- */

  function revisaSoporte() {
    if (!window.isSecureContext) {
      aviso.innerHTML = "Esta página necesita abrirse por <code>https://</code> o desde <code>localhost</code>. " +
                        "Abierta como archivo (<code>file://</code>) el navegador bloquea el acceso al NFC.";
      aviso.classList.add("visible");
      return false;
    }
    if (!("NDEFReader" in window)) {
      aviso.innerHTML = "Tu navegador no puede leer NFC. Web NFC funciona en <b>Chrome para Android 8 o superior</b>; " +
                        "en iPhone y en navegadores de escritorio no está disponible.";
      aviso.classList.add("visible");
      return false;
    }
    return true;
  }

  const compatible = revisaSoporte();
  if (!compatible) {
    btnEscanear.disabled = true;
    btnCapturar.disabled = true;
    btnEscanear.style.opacity = ".45";
    btnCapturar.style.opacity = ".45";
  }

  /* ---------- Objetivo ---------- */

  function actualizaChip() {
    const v = objetivo.value.trim();
    if (!v) {
      objetivoChip.textContent = "Sin objetivo definido";
      return;
    }
    objetivoChip.innerHTML = (modo === "texto" ? "Buscando el texto " : "Buscando ") +
                             "<b>" + v.replace(/[<>&]/g, "") + "</b>";
  }

  objetivo.addEventListener("input", () => {
    if (modo !== "texto") {
      const cursorAlFinal = objetivo.selectionStart === objetivo.value.length;
      const limpio = bonito(objetivo.value);
      if (limpio !== objetivo.value && cursorAlFinal) objetivo.value = limpio;
    }
    actualizaChip();
    reevalua();
  });

  document.querySelectorAll(".modo").forEach(b => {
    b.addEventListener("click", () => {
      modo = b.dataset.modo;
      document.querySelectorAll(".modo").forEach(o =>
        o.setAttribute("aria-pressed", String(o === b)));
      objetivo.placeholder = modo === "texto"
        ? "Expediente 4471"
        : (modo === "cola" ? "4D:5E:6F" : "04:1A:2B:3C:4D:5E:6F");
      $("etiquetaObjetivo").textContent = modo === "texto"
        ? "Texto que buscas dentro del tag"
        : "Tag que buscas";
      actualizaChip();
      reevalua();
    });
  });

  /* ---------- Comparación ---------- */

  function coincide(uid, texto) {
    const meta = objetivo.value.trim();
    if (!meta) return false;

    if (modo === "texto") {
      return (texto || "").toLowerCase().includes(meta.toLowerCase());
    }
    const a = normaliza(uid), b = normaliza(meta);
    if (!a || !b) return false;
    if (modo === "cola") {
      const cola = b.slice(-6);          // últimos 3 bytes
      return cola.length > 0 && a.endsWith(cola);
    }
    return a === b;
  }

  /* Si cambia el objetivo, vuelve a marcar el historial */
  function reevalua() {
    vistas.forEach(v => { v.esta = coincide(v.uid, v.texto); });
    dibujaHistorial();
  }

  /* ---------- Historial ---------- */

  function dibujaHistorial() {
    historial.innerHTML = "";
    const lista = [...vistas.values()].reverse();
    vacio.style.display = lista.length ? "none" : "block";
    resumenLista.textContent = lista.length ? "(" + lista.length + ")" : "";

    lista.forEach(v => {
      const li = document.createElement("li");
      if (v.esta) li.className = "esta";
      const uid = document.createElement("span");
      uid.className = "uid mono";
      uid.textContent = bonito(v.uid) + (v.texto ? "  ·  " + v.texto : "");
      const marca = document.createElement("span");
      marca.className = "marca";
      marca.textContent = v.esta ? "es esta" : v.hora;
      li.append(uid, marca);
      historial.appendChild(li);
    });

    const encontradas = lista.filter(v => v.esta).length;
    contador.textContent = lista.length
      ? lista.length + (lista.length === 1 ? " tag leída" : " tags distintas leídas") +
        (encontradas ? " · ya apareció la que buscas" : "")
      : "";
  }

  btnLimpiar.addEventListener("click", () => {
    vistas.clear();
    dibujaHistorial();
    if (escaneando) pinta("buscando", "Escaneando", "Acerca la antena del teléfono a cada tag.");
  });

  /* ---------- Lectura ---------- */

  function extraeTexto(mensaje) {
    if (!mensaje || !mensaje.records) return "";
    const partes = [];
    for (const r of mensaje.records) {
      try {
        if (r.recordType === "text") {
          partes.push(new TextDecoder(r.encoding || "utf-8").decode(r.data));
        } else if (r.recordType === "url" || r.recordType === "absolute-url") {
          partes.push(new TextDecoder().decode(r.data));
        }
      } catch (e) {}
    }
    return partes.join(" · ");
  }

  function alLeer({ serialNumber, message }) {
    const uid = normaliza(serialNumber);
    const texto = extraeTexto(message);
    clearTimeout(restaurar);

    /* Modo capturar: la primera tag define el objetivo */
    if (capturando) {
      capturando = false;
      btnCapturar.textContent = "Capturar de un tag";
      if (modo === "texto" && texto) {
        objetivo.value = texto;
      } else if (uid) {
        objetivo.value = modo === "cola" ? bonito(uid.slice(-6)) : bonito(uid);
      }
      actualizaChip();
      reevalua();
      vibra(60);
      pita(740, 0.09);
      pinta("buscando", "Objetivo fijado", "Ahora pasa el teléfono por las demás tags.", uid, texto);
      return;
    }

    if (!uid && !texto) {
      pinta("problema", "Lectura vacía", "La tag respondió pero no devolvió identificador. Vuelve a pasarla más despacio.");
      vibra([40, 60, 40]);
      volverABuscar(2200);
      return;
    }

    const clave = uid || ("txt:" + texto);
    const esta = coincide(uid, texto);
    const hora = new Date().toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
    vistas.set(clave, { uid, texto, esta, hora });
    dibujaHistorial();

    if (esta) {
      vibra([140, 70, 140, 70, 320]);
      pita(880, 0.14);
      setTimeout(() => pita(1320, 0.26), 150);
      detiene(true);                                  // se apaga el lector al encontrarla
      pinta("acierto", "Es esta", "Escaneo detenido. No hace falta seguir barriendo.", uid, texto);
    } else {
      pinta("fallo", "No es", objetivo.value.trim() ? "Sigue con la siguiente." : "Aún no has definido qué tag buscas.", uid, texto);
      vibra(35);
      pita(320, 0.06);
      volverABuscar(2500);
    }
  }

  function volverABuscar(ms) {
    restaurar = setTimeout(() => {
      if (escaneando) pinta("buscando", "Escaneando", "Acerca la antena del teléfono a cada tag.");
    }, ms);
    dibujaHistorial();
  }

  function alFallar() {
    pinta("problema", "No se pudo leer", "Mantén el teléfono pegado a la tag un segundo más.");
    vibra([40, 60, 40]);
    volverABuscar(2200);
  }

  /* ---------- Arranque y paro ---------- */

  async function arranca() {
    if (escaneando) return true;
    despiertaAudio();
    try {
      control = new AbortController();
      const lector = new NDEFReader();
      await lector.scan({ signal: control.signal });
      lector.onreading = alLeer;
      lector.onreadingerror = alFallar;
      escaneando = true;
      btnEscanear.textContent = "Detener escaneo";
      btnEscanear.classList.add("activo");
      mantenPantalla(true);
      pinta("buscando", "Escaneando", "Acerca la antena del teléfono a cada tag.");
      dibujaHistorial();
      return true;
    } catch (e) {
      escaneando = false;
      control = null;
      const nombre = e && e.name;
      if (nombre === "NotAllowedError") {
        pinta("problema", "Permiso denegado",
              "Acepta el permiso de NFC cuando el navegador lo pida. Si ya lo rechazaste, bórralo en los ajustes del sitio en Chrome.");
      } else if (nombre === "NotSupportedError" || nombre === "NotReadableError") {
        pinta("problema", "NFC apagado",
              "Enciende el NFC en los ajustes del teléfono y vuelve a intentarlo.");
      } else {
        pinta("problema", "No se pudo iniciar", (e && e.message) || "Error desconocido al abrir el lector NFC.");
      }
      return false;
    }
  }

  function detiene(porHallazgo) {
    if (control) { try { control.abort(); } catch (e) {} }
    control = null;
    escaneando = false;
    capturando = false;
    clearTimeout(restaurar);
    btnEscanear.textContent = porHallazgo ? "Reanudar escaneo" : "Iniciar escaneo";
    btnEscanear.classList.remove("activo");
    btnCapturar.textContent = "Capturar de un tag";
    mantenPantalla(false);
    if (!porHallazgo) {
      pinta("reposo", "Detenido", "El escaneo está apagado.");
      dibujaHistorial();
    }
  }

  btnEscanear.addEventListener("click", () => {
    escaneando ? detiene() : arranca();
  });

  btnCapturar.addEventListener("click", async () => {
    if (capturando) {
      capturando = false;
      btnCapturar.textContent = "Capturar de un tag";
      if (escaneando) pinta("buscando", "Escaneando", "Acerca la antena del teléfono a cada tag.");
      return;
    }
    const listo = escaneando || await arranca();
    if (!listo) return;
    capturando = true;
    btnCapturar.textContent = "Cancelar captura";
    clearTimeout(restaurar);
    pinta("buscando", "Pasa la tag modelo",
          modo === "texto" ? "Se guardará el texto grabado en esa tag."
                           : "Se guardará su identificador como objetivo.");
  });

  /* El escaneo se corta al mandar la app a segundo plano: lo reanudamos al volver */
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && escaneando && !wakeLock) mantenPantalla(true);
  });

  actualizaChip();
  dibujaHistorial();
})();
</script>
</body>
</html>
